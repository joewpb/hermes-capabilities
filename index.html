<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Agent — Capability Explorer</title>
<style>
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1a1a24;
  --border: #252530;
  --text: #d4d4d8;
  --text2: #90909a;
  --text3: #60606a;
  --accent: #8b5cf6;
  --accent2: #7c3aed;
  --green: #22c55e;
  --amber: #f59e0b;
  --red: #ef4444;
  --blue: #3b82f6;
  --cyan: #06b6d4;
  --radius: 8px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.6;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Header */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.logo {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
}
.logo span { color: var(--accent); }
.stats-row {
  display: flex;
  gap: 16px;
  font-size: 13px;
  color: var(--text2);
}
.stat { display: flex; align-items: center; gap: 6px; }
.stat .num { color: var(--accent); font-weight: 600; font-family: var(--mono); }

/* Search */
.search-wrap {
  max-width: 1400px;
  margin: 24px auto 0;
  padding: 0 24px;
}
.search-bar {
  width: 100%;
  padding: 12px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 15px;
  font-family: var(--font);
  outline: none;
  transition: border-color 0.2s;
}
.search-bar:focus { border-color: var(--accent); }
.search-bar::placeholder { color: var(--text3); }

/* Tabs */
.tabs-wrap {
  max-width: 1400px;
  margin: 24px auto 0;
  padding: 0 24px;
}
.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
.tab-btn {
  padding: 10px 20px;
  background: none;
  border: none;
  color: var(--text2);
  font-size: 14px;
  font-family: var(--font);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-count { font-family: var(--mono); font-size: 11px; color: var(--text3); margin-left: 4px; }

/* Content */
.content {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px;
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Skill cards */
.category-group { margin-bottom: 32px; }
.category-name {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text3);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.skills-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 8px;
}
.skill-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.skill-card:hover { border-color: var(--accent); background: var(--surface2); }
.skill-card .name {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--accent);
  margin-bottom: 4px;
}
.skill-card .desc {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.skill-card.expanded .desc { -webkit-line-clamp: unset; }

/* Tool cards */
.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 8px;
}
.tool-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  transition: border-color 0.15s;
}
.tool-card:hover { border-color: var(--accent); }
.tool-card .name {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--cyan);
  margin-bottom: 4px;
}
.tool-card .desc { font-size: 13px; color: var(--text2); }

/* Server cards */
.server-wrap { margin-bottom: 32px; }
.server-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.server-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}
.server-meta {
  font-size: 12px;
  color: var(--text3);
  font-family: var(--mono);
}
.server-meta .badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
}
.badge-transport { background: rgba(139,92,246,0.15); color: var(--accent); }
.badge-count { background: rgba(6,182,212,0.15); color: var(--cyan); }

/* No results */
.no-results {
  text-align: center;
  padding: 48px;
  color: var(--text3);
}

/* Footer */
footer {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px;
  border-top: 1px solid var(--border);
  color: var(--text3);
  font-size: 12px;
  text-align: center;
}

/* Responsive */
@media (max-width: 768px) {
  .skills-grid, .tools-grid { grid-template-columns: 1fr; }
  .header-inner { flex-direction: column; align-items: flex-start; }
}

/* hidden utility */
.hidden { display: none !important; }
</style>

// Render functions
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function highlight(text, query) {
  if (!query) return escapeHtml(text);
  const words = query.split(/\s+/).filter(w => w.length > 0);
  let result = escapeHtml(text);
  words.forEach(w => {
    const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    result = result.replace(re, '<mark style="background:rgba(139,92,246,0.3);color:#c4b5fd;border-radius:2px;padding:0 2px">$1</mark>');
  });
  return result;
}

function matchesFilter(text, query) {
  if (!query) return true;
  const words = query.toLowerCase().split(/\s+/).filter(w => w.length > 0);
  const t = text.toLowerCase();
  return words.every(w => t.includes(w));
}

// ---- SKILLS ----
function renderSkills(query) {
  const panel = document.getElementById('panel-skills');
  let html = '';
  let totalVisible = 0;
  for (const [category, skills] of Object.entries(DATA.skills)) {
    const filtered = skills.filter(s => matchesFilter(s.name + ' ' + s.desc, query));
    if (filtered.length === 0) continue;
    totalVisible += filtered.length;
    html += '<div class="category-group">';
    html += '<div class="category-name">' + escapeHtml(category) + ' <span style="font-weight:400;color:var(--text3)">(' + filtered.length + ')</span></div>';
    html += '<div class="skills-grid">';
    filtered.forEach(s => {
      html += '<div class="skill-card" onclick="this.classList.toggle(\'expanded\')">';
      html += '<div class="name">' + highlight(s.name, query) + '</div>';
      html += '<div class="desc">' + highlight(s.desc, query) + '</div>';
      html += '</div>';
    });
    html += '</div></div>';
  }
  if (totalVisible === 0) {
    html = '<div class="no-results">No skills match "' + escapeHtml(query) + '"</div>';
  }
  panel.innerHTML = html;
}

// ---- DIRECT TOOLS ----
function renderDirectTools(query) {
  const panel = document.getElementById('panel-direct-tools');
  const filtered = DATA.direct_tools.filter(t => matchesFilter(t.name + ' ' + t.desc, query));
  if (filtered.length === 0) {
    panel.innerHTML = '<div class="no-results">No tools match "' + escapeHtml(query) + '"</div>';
    return;
  }
  let html = '<div class="tools-grid">';
  filtered.forEach(t => {
    html += '<div class="tool-card">';
    html += '<div class="name">' + highlight(t.name, query) + '</div>';
    html += '<div class="desc">' + highlight(t.desc, query) + '</div>';
    html += '</div>';
  });
  html += '</div>';
  panel.innerHTML = html;
}

// ---- MCP / PLUGIN TOOLS ----
function renderMcpTools(query) {
  const panel = document.getElementById('panel-mcp-tools');
  let html = '';
  let totalVisible = 0;
  for (const [server, info] of Object.entries(DATA.mcp_servers)) {
    const filtered = info.tools.filter(t => matchesFilter(t.name + ' ' + t.desc, query));
    if (filtered.length === 0) continue;
    totalVisible += filtered.length;
    html += '<div class="server-wrap">';
    html += '<div class="server-header">';
    html += '<div class="server-name">' + escapeHtml(server) + '</div>';
    html += '<div class="server-meta">';
    html += '<span class="badge badge-count">' + filtered.length + ' tools</span> ';
    html += '<span class="badge badge-transport">' + escapeHtml(info.transport) + '</span>';
    html += '</div></div>';
    html += '<div class="tools-grid">';
    filtered.forEach(t => {
      html += '<div class="tool-card">';
      html += '<div class="name">' + highlight(t.name, query) + '</div>';
      html += '<div class="desc">' + highlight(t.desc, query) + '</div>';
      html += '</div>';
    });
    html += '</div></div>';
  }
  if (totalVisible === 0) {
    html = '<div class="no-results">No tools match "' + escapeHtml(query) + '"</div>';
  }
  panel.innerHTML = html;
}

// ---- SERVERS ----
function renderServers(query) {
  const panel = document.getElementById('panel-servers');
  const entries = Object.entries(DATA.mcp_servers).filter(([name, info]) =>
    matchesFilter(name + ' ' + info.transport, query)
  );
  if (entries.length === 0) {
    panel.innerHTML = '<div class="no-results">No servers match "' + escapeHtml(query) + '"</div>';
    return;
  }
  let html = '';
  entries.forEach(([name, info]) => {
    html += '<div class="server-wrap">';
    html += '<div class="server-header">';
    html += '<div class="server-name">' + escapeHtml(name) + '</div>';
    html += '<div class="server-meta">';
    html += '<span class="badge badge-count">' + info.tool_count + ' tools total</span> ';
    html += '<span class="badge badge-transport">' + escapeHtml(info.transport) + '</span>';
    html += '</div></div>';
    html += '<div class="tools-grid">';
    info.tools.slice(0, 12).forEach(t => {
      html += '<div class="tool-card">';
      html += '<div class="name">' + escapeHtml(t.name) + '</div>';
      html += '<div class="desc">' + escapeHtml(t.desc) + '</div>';
      html += '</div>';
    });
    if (info.tools.length > 12) {
      html += '<div style="color:var(--text3);font-size:12px;padding:8px 16px">... and ' + (info.tools.length - 12) + ' more tools (switch to MCP Tools tab to search)</div>';
    }
    html += '</div></div>';
  });
  panel.innerHTML = html;
}

function renderAll() {
  const q = search.value;
  renderSkills(q);
  renderDirectTools(q);
  renderMcpTools(q);
  renderServers(q);
}

renderAll();
